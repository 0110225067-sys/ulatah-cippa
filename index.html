<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Happy Birthday!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(#ffb6e6, #ffd6f5);
            font-family: "Poppins", sans-serif;
            text-align: center;
            color: #e195c6;
        }

        .card {
            margin: 40px auto;
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff5fd8; }
            to { text-shadow: 0 0 25px #ff00ff; }
        }

        .photo {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #ff8ad8;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .balloons {
            font-size: 45px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
            100% { transform: translateY(0); }
        }

        button {
            padding: 12px 25px;
            background: #ff5fd8;
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }

        button:hover {
            background: #e100c0;
        }

        #wish {
            font-size: 20px;
            margin-top: 15px;
            color: #7a006b;
        }
    </style>
</head>
<body>

    <audio id="music" loop>
        <source src="musik_cippa.mp3" type="audio/mp4" />
    </audio>

    <div class="card">
        <img src="cippa.jpg" alt="Foto" class="photo" />
        <h1>          🎀  
                      Happy🎀    
                      Birthday   
                      cippa!! 
                      🎀🎀🎀</h1>
        
        <p id="wish"></p>
        <button onclick="showMessage()">Klik untuk Ucapan</button><br>
        <button onclick="playMusic()">Putar Musik 🎶</button>
    </div>

    <script>
        function showMessage() {
            document.getElementById("wish").innerHTML =
                " Selamat ulang tahun cippa Semoga hari ini penuh kebahagiaan, kesehatan, dan hal-hal baik yang kamu inginkan.Tetap jadi pribadi yang baik dan ceria ya🎀💗 Semoga hari ulang tahunmu penuh kebahagiaan, senyum imut, dan harapan yang indah! 🎀💗";
        }

        function playMusic() {
            document.getElementById("music").play();
        }
    </script>

</body>
</html>
